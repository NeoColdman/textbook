[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "textbook-cli"
version = "1.0.0"
description = "在终端搜索和下载国家中小学智慧教育平台电子教材"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "typer>=0.16,<1",
  "prompt-toolkit>=3.0.51,<4",
  "rich>=14,<15",
  "requests>=2.32,<3",
  "platformdirs>=4,<5",
  "keyring>=25,<26",
  "filelock>=3.18,<4",
  "pypdf>=6.18,<7",
]

[project.scripts]
textbook = "textbook_cli.cli.commands:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "contract: 脱敏平台响应契约",
  "local_http: 本地 HTTP 传输集成",
  "cli: 命令与交互测试",
  "live: 显式启用的真实平台检查",
]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
